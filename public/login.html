<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anjali Super Mart - Owner Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      font-family: Arial, sans-serif;
      color: white;
    }

    .login-box {
      width: 90%;
      max-width: 400px;
      background: #1e1e1e;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 10px 30px #000;
    }

    h1 {
      text-align: center;
      color: #00c853;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      border: 1px solid #444;
      border-radius: 10px;
      background: #292929;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      background: #00c853;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      color: #ff5252;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>🛒 Anjali Super Mart</h1>
    <div class="subtitle">Owner Login</div>

    <input
      type="email"
      id="email"
      placeholder="Owner Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button onclick="login()">Login</button>

    <div id="message"></div>
  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword
    }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    // FIREBASE CONFIG
    // ==============================

      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
